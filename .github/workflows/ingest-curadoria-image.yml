name: Ingest curadoria image
on:
  push:
    branches:
      - substitui-foto-curadoria-editorial
permissions:
  contents: write
jobs:
  ingest:
    if: github.event.head_commit.message != 'Adiciona retrato editorial da curadoria'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: substitui-foto-curadoria-editorial
      - name: Baixar imagem aprovada
        run: |
          mkdir -p public/assets/images
          curl -L --fail --retry 3 "https://at.adobe.com/8zUusWhNOTC5X5mZ" -o public/assets/images/camilla-curadoria-editorial.png
          python - <<'PY'
          from pathlib import Path
          p=Path("public/assets/images/camilla-curadoria-editorial.png")
          data=p.read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n", "Arquivo baixado não é PNG válido"
          print(f"PNG válido: {len(data)} bytes")
          PY
      - name: Commitar imagem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/images/camilla-curadoria-editorial.png
          git commit -m "Adiciona retrato editorial da curadoria"
          git push origin substitui-foto-curadoria-editorial
