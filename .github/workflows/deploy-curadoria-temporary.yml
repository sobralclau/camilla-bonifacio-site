name: Deploy curadoria with detected Cloudflare account

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-curadoria-temporary.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Detect Cloudflare account and deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler whoami --json > /tmp/whoami.json
          ACCOUNT_ID="$(node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("/tmp/whoami.json","utf8"));
            const candidates=[];
            function walk(v,k=""){
              if(Array.isArray(v)) for(const x of v) walk(x,k);
              else if(v && typeof v==="object") for(const [key,val] of Object.entries(v)){
                if((key==="id" || key==="account_id" || key==="accountId") && typeof val==="string" && /^[a-f0-9]{32}$/i.test(val)) candidates.push(val);
                walk(val,key);
              }
            }
            walk(data);
            if(!candidates.length) process.exit(2);
            process.stdout.write(candidates[0]);
          ')"
          test -n "$ACCOUNT_ID"
          CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx wrangler deploy

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-curadoria-temporary.yml
          git commit -m "Remove fluxo temporário de publicação"
          git push origin main
